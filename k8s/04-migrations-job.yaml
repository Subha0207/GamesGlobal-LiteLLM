# Schema migrations run once, here. The proxy pods run with
# DISABLE_SCHEMA_UPDATE=true so N replicas never race each other on the schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-migrations
  namespace: litellm
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: litellm
        component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: litellm
      containers:
        - name: migrations
          image: ${LITELLM_IMAGE}
          command: ["python", "litellm/proxy/prisma_migration.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DATABASE_URL
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
            - name: USE_PRISMA_MIGRATE
              value: "True"
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            # Prisma's migration engine spikes well past 2Gi on a cold start;
            # at that ceiling the Job is OOMKilled and retried until
            # backoffLimit is exhausted, which surfaces as the deploy script
            # timing out on "wait --for=condition=complete".
            limits:
              memory: "4Gi"
