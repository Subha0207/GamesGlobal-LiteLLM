apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: litellm
  annotations:
    # IRSA: gives the proxy pods an AWS identity, used to read their own
    # Secrets Manager secret. Provider credentials come from the Kubernetes
    # Secret, not from AWS.
    eks.amazonaws.com/role-arn: ${LITELLM_IRSA_ROLE_ARN}
