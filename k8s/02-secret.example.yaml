# Reference only. The real Secret is rendered by scripts/30-deploy-litellm.sh
# from terraform outputs into k8s/rendered/02-secret.yaml, which is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: litellm
type: Opaque
stringData:
  # Postgres (RDS). LiteLLM stores keys, teams, spend AND the model/provider list here.
  DATABASE_URL: "postgresql://litellm:CHANGEME@litellm-poc-postgres.xxxx.us-east-1.rds.amazonaws.com:5432/litellm?sslmode=require"

  # Admin key. Also the UI login password for the default admin user.
  LITELLM_MASTER_KEY: "sk-CHANGEME"

  # Encrypts provider API keys at rest in Postgres.
  # Rotating this after models exist makes every stored credential unreadable.
  LITELLM_SALT_KEY: "sk-CHANGEME"

  # Valkey (ElastiCache) - router state, cache, rate limits across replicas.
  REDIS_HOST: "litellm-poc-valkey.xxxx.use1.cache.amazonaws.com"
  REDIS_PORT: "6379"

  # Separate UI login. Leave unset to log in as "admin" with the master key.
  UI_USERNAME: "admin"
  UI_PASSWORD: "CHANGEME"

  # Provider keys referenced by os.environ/... in DB model entries.
  # These must be populated BEFORE scripts/40-seed-providers.sh runs: the
  # reference is resolved when the model row is written, not when it is read.
  GEMINI_API_KEY: ""
  HUGGINGFACE_API_KEY: ""
